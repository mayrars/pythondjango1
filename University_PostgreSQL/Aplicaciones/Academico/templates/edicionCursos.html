<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;400;700&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.all.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.17.2/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'css/gestionCursos.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-success bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">Cursos</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/contacto">Contacto</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    <div class="container py-4">
        <div class="row">
            <div class="col-md-4 offset-4">
              <h2>Gestion de Curso</h2>
              <div class="card">
                <div class="card-body">
                  <form id="formularioCurso" action="/editarCurso/" method="POST">
                    {% csrf_token %}
                    <input type="hidden" id="txtId" name="txtId" value="{{curso.id}}">
                    <div class="form-group">
                      <input type="text" id="txtNombre" name="txtNombre" class="form-control" value="{{curso.nombre}}" placeholder="Nombre" minlength="3" maxlength="30" autofocus required>
                    </div>
                    <div class="form-group mt-3">
                      <input type="number" id="numCreditos" name="numCreditos" class="form-control" step="1" min="1" max="10" value="{{curso.creditos}}" required>
                    </div>
                    <div class="form-group mt-3">
                      <button type="submit" class="btn btn-success btn-block"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
        </div>
    </div>
    <script src="{% static 'js/utils/notificacionSwal.js' %}"></script>
    <script src="{% static 'js/gestionCursos.js' %}"></script>
</body>
</html>
