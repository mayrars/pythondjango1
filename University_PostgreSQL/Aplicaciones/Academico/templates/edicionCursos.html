{% extends "./base.html" %}

{% block title %}Gestión de cursos{% endblock %}

{% block body %}
  <div>
    <div class="row">
      <div class="col-md-4 offset-4">
        <h2>Gestion de Curso</h2>
        <div class="card">
          <div class="card-body">
            <form id="formularioCurso" action="/editarCurso/" method="POST">
              {% csrf_token %}
              <input type="hidden" id="txtId" name="txtId" value="{{curso.id}}">
              <div class="form-group">
                <input type="text" id="txtNombre" name="txtNombre" class="form-control" value="{{curso.nombre}}" placeholder="Nombre" minlength="3" maxlength="30" autofocus required>
              </div>
              <div class="form-group mt-3">
                <input type="number" id="numCreditos" name="numCreditos" class="form-control" step="1" min="1" max="10" value="{{curso.creditos}}" required>
              </div>
              <div class="form-group mt-3">
                <button type="submit" class="btn btn-success btn-block"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
