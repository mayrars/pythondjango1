{% extends "./base.html" %}

{% block title %}Gestión de Cursos{% endblock %}

{% block body %}
  <div class="container py-4">
    <div class="row">
      <div class="col-md-4">
        <h2>Crear Curso</h2>
        <div class="card">
          <div class="card-body">
            <form id="formularioCurso" action="/registrarCurso/" method="POST">
              {% csrf_token %}
              <div class="form-group">
                <input typse="text" id="txtNombre" name="txtNombre" class="form-control" placeholder="Nombre" minlength="3" maxlength="30" autofocus required>
              </div>
              <div class="form-group mt-3">
                <input type="number" id="numCreditos" name="numCreditos" class="form-control" step="1" min="1" max="10" value="1" required>
              </div>
              <div class="form-group mt-3">
                <button type="submit" class="btn btn-succaess btn-block"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <h2>Listado de cursos</h2>
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
                <tr>
                    <th class="centrado">#</th>
                    <th class="centrado">Curso</th>
                    <th>Crèditos</th>
                    <th colspan="2">Opciones</th>
                </tr>
            </thead>
            <tbody>
              {% for c in object_list %}
                <tr>
                  <td>{{forloop.counter}}</td>
                  <td>{{c.nombre}}</td>
                  <td>{{c.creditos}}</td>
                  <td><a href="edicionCurso/{{c.id}}" class="btn btn-sm btn-block btn-info"> <i class="fa-solid fa-pencil"></i> Editar</a></td>
                  <td><a href="eliminacionCurso/{{c.id}}" class="btn btn-sm btn-block btn-danger btnEliminacion"><i class="fa-solid fa-trash"></i> Eliminar</a></td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
