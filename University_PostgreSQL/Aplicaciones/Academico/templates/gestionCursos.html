<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Cursos</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Curso</th>
            </tr>
        </thead>
        <tbody>
            {% for c in cursos %}
                <tr>
                    <td>{{c.nombre}}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
